<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#929FF8">
  <meta name="color-scheme" content="dark">
  <title>Школьный помощник</title>

  <style>
    :root {
      --bg: #141629;          /* фон страницы */
      --surface: #1F2243;     /* ответы бота, поле ввода */
      --accent: #929FF8;      /* шапка, вопросы ученика, кнопки */
      --on-accent: #141629;   /* текст на акцентном цвете */
      --text: #F2F3FF;
      --muted: #9CA1CC;
      --line: rgba(255, 255, 255, .1);
      --danger: #FF9AA5;

      --gutter: max(18px, calc((100% - 760px) / 2));

      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 22px;
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ---------- Шапка ---------- */

    .top {
      flex: none;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gutter) 14px;
      background: var(--accent);
      color: var(--on-accent);
    }

    .avatar {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      font-family: var(--font-emoji);
      font-size: 24px;
      line-height: 1;
    }

    .who { flex: 1; min-width: 0; }
    .who h1 {
      margin: 0;
      font-size: 20px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .who p {
      margin: 0;
      font-size: 15px;
      line-height: 20px;
      color: rgba(20, 22, 41, .78);
    }

    .clear {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      min-width: 40px;
      padding: 0 10px;
      font: 600 14px/1 var(--font);
      color: var(--on-accent);
      background: transparent;
      border: 1.5px solid rgba(20, 22, 41, .5);
      border-radius: 999px;
      cursor: pointer;
    }
    .clear svg { width: 20px; height: 20px; flex: none; }
    .clear span { display: none; }
    .clear:hover:not(:disabled) { color: var(--accent); background: var(--on-accent); border-color: var(--on-accent); }
    .clear:disabled { opacity: .4; cursor: default; }

    @media (max-width: 420px) {
      .top { gap: 12px; }
      .who p { font-size: 14px; line-height: 18px; }
      .clear { height: 36px; min-width: 36px; padding: 0 8px; }
    }

    @media (min-width: 560px) {
      .clear { padding: 0 16px; }
      .clear span { display: inline; }
    }

    /* ---------- Переписка ---------- */

    .log {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-color: #3A3E6E transparent;
      padding: 20px var(--gutter);
    }

    .msg {
      max-width: min(85%, 34rem);
      padding: 10px 14px;
      border-radius: 18px;
      overflow-wrap: anywhere;
    }

    .msg.user {
      align-self: flex-end;
      color: var(--on-accent);
      background: var(--accent);
      border-bottom-right-radius: 6px;
    }

    .msg.bot {
      align-self: flex-start;
      color: var(--text);
      background: var(--surface);
      border-bottom-left-radius: 6px;
    }

    .msg.pop {
      transform-origin: left bottom;
      animation: pop .22s ease-out;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: none; }
    }

    .msg p { margin: 0; }

    .msg.error {
      box-shadow: inset 0 0 0 1.5px var(--danger);
    }

    .retry {
      margin-top: 10px;
      height: 36px;
      padding: 0 16px;
      font: 600 14px/1 var(--font);
      color: var(--on-accent);
      background: var(--accent);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }
    .retry:hover { background: #A8B2FA; }

    /* Бот «печатает» */
    .typing { display: flex; align-items: center; gap: 6px; width: 64px; height: 42px; }
    .typing i {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .3;
      animation: pulse 1s infinite ease-in-out;
    }
    .typing i:nth-of-type(2) { animation-delay: .15s; }
    .typing i:nth-of-type(3) { animation-delay: .3s; }

    @keyframes pulse {
      0%, 100% { opacity: .3; }
      40%      { opacity: 1; }
    }

    /* ---------- Ввод ---------- */

    .composer {
      flex: none;
      padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      border-top: 1px solid var(--line);
    }

    .chips {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      padding: 2px 2px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: none;
      height: 36px;
      padding: 0 14px;
      font: 500 14px/1 var(--font);
      color: var(--accent);
      background: transparent;
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover:not(:disabled) { color: var(--on-accent); background: var(--accent); }
    .chip:active:not(:disabled) { transform: translateY(1px); }
    .chip:disabled { opacity: .45; cursor: default; }

    .form { display: flex; gap: 8px; }

    .field {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 18px;
      font: 400 16px/1 var(--font);
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 999px;
    }
    .field::placeholder { color: var(--muted); }
    .field:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .send {
      flex: none;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      color: var(--on-accent);
      background: var(--accent);
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }
    .send:hover:not(:disabled) { background: #A8B2FA; }
    .send:disabled { opacity: .4; cursor: default; }
    .send svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="avatar" aria-hidden="true">🎒</div>
      <div class="who">
        <h1>Школьный помощник</h1>
        <p>Отвечает на вопросы про школу</p>
      </div>
      <button class="clear" id="clear" type="button" aria-label="Очистить чат" title="Очистить чат">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
        </svg>
        <span>Очистить</span>
      </button>
    </header>

    <main class="log" id="log" role="log" aria-label="Переписка с помощником"></main>

    <div class="composer">
      <div class="chips" id="chips" role="group" aria-label="Быстрые вопросы"></div>

      <form class="form" id="form" autocomplete="off">
        <label class="sr-only" for="msg">Твой вопрос</label>
        <input class="field" id="msg" type="text" maxlength="500"
               placeholder="Спроси про уроки, столовую, экзамены"
               enterkeyhint="send" autocomplete="off" autocapitalize="sentences">
        <button class="send" id="send" type="submit" aria-label="Отправить" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const API_URL = 'https://school-helper-bot-s7n1.onrender.com/api/message';
      const MIN_TYPING_MS = 450;

      const WELCOME =
        'Привет! Спроси про расписание, столовую, каникулы, экзамены или кружки. ' +
        'Или выбери вопрос внизу.';

      const QUESTIONS = [
        'Расписание',
        'Что в столовой?',
        'Когда каникулы?',
        'Что задали?',
        'Как сдать ЕГЭ?',
        'Где медпункт?',
        'Какие есть секции?',
        'Где директор?',
        'Как исправить двойку?'
      ];

      const log = document.getElementById('log');
      const form = document.getElementById('form');
      const input = document.getElementById('msg');
      const sendBtn = document.getElementById('send');
      const clearBtn = document.getElementById('clear');
      const chipsBox = document.getElementById('chips');

      let busy = false;
      let hasConversation = false;

      function scrollDown() {
        log.scrollTop = log.scrollHeight;
      }

      function addUser(text) {
        const el = document.createElement('div');
        el.className = 'msg user';
        el.textContent = text;
        log.append(el);
        scrollDown();
      }

      function addBot(text, animate) {
        const el = document.createElement('div');
        el.className = 'msg bot' + (animate ? ' pop' : '');
        el.textContent = text;
        log.append(el);
        scrollDown();
        return el;
      }

      function addTyping() {
        const el = document.createElement('div');
        el.className = 'msg bot typing';
        el.innerHTML = '<span class="sr-only">Помощник печатает…</span>' +
                       '<i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i>';
        log.append(el);
        scrollDown();
        return el;
      }

      function addError(message, retryText) {
        const el = document.createElement('div');
        el.className = 'msg bot error';

        const p = document.createElement('p');
        p.textContent = message;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'retry';
        btn.textContent = 'Повторить';
        btn.addEventListener('click', function () {
          el.remove();
          request(retryText, false);
        });

        el.append(p, btn);
        log.append(el);
        scrollDown();
      }

      function sleep(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      async function fetchAnswer(text) {
        let res;
        try {
          res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
          });
        } catch (e) {
          const err = new Error('network');
          err.kind = 'network';
          throw err;
        }

        if (!res.ok) {
          const err = new Error('http');
          err.kind = 'http';
          err.status = res.status;
          throw err;
        }

        let data;
        try {
          data = await res.json();
        } catch (e) {
          const err = new Error('format');
          err.kind = 'format';
          throw err;
        }

        if (!data || typeof data.answer !== 'string') {
          const err = new Error('format');
          err.kind = 'format';
          throw err;
        }
        return data.answer;
      }

      function errorText(err) {
        if (err.kind === 'network') return 'Помощник не отвечает. Проверь подключение и повтори.';
        if (err.kind === 'http') return 'Сервер вернул ошибку (' + err.status + '). Повтори через минуту.';
        return 'Ответ пришёл в непонятном виде. Повтори вопрос.';
      }

      async function request(text, echo) {
        if (busy) return;
        setBusy(true);

        log.querySelectorAll('.error').forEach(function (n) { n.remove(); });
        if (echo) {
          addUser(text);
          hasConversation = true;
          updateControls();
        }

        const typing = addTyping();
        try {
          const result = await Promise.all([fetchAnswer(text), sleep(MIN_TYPING_MS)]);
          typing.post ? null : null;
          typing.remove();
          addBot(result[0], true);
        } catch (err) {
          typing.remove();
          addError(errorText(err), text);
        } finally {
          setBusy(false);
        }
      }

      function setBusy(value) {
        busy = value;
        updateControls();
      }

      function updateControls() {
        sendBtn.disabled = busy || !input.value.trim();
        clearBtn.disabled = busy || !hasConversation;
        chipsBox.querySelectorAll('.chip').forEach(function (c) { c.disabled = busy; });
      }

      function reset() {
        log.replaceChildren();
        hasConversation = false;
        addBot(WELCOME, false);
        log.scrollTop = 0;
        updateControls();
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;
        input.value = '';
        request(text, true);
        updateControls(); // Сразу обновляем состояние кнопки после очистки поля
      });

      input.addEventListener('input', updateControls);
      clearBtn.addEventListener('click', reset);

      QUESTIONS.forEach(function (q) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = q;
        chip.addEventListener('click', function () { request(q, true); });
        chipsBox.append(chip);
      });

      // Инициализация при старте (приветствие бота)
      reset();
    })();
  </script>
</body>
</html>
